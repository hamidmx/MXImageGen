<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>How To Draw — Bulk Generator</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20ry='14'%20fill='%232563eb'/%3E%3Ctext%20x='32'%20y='45'%20font-family='-apple-system,Segoe%20UI,Roboto,sans-serif'%20font-size='40'%20font-weight='700'%20text-anchor='middle'%20fill='%23ffffff'%3ED%3C/text%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    color: #1f2937;
  }
  header {
    background: #111827;
    color: #fff;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }
  .version-tag {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 8px;
    background: #2563eb;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .configs-wrap { position: relative; }
  .configs-btn {
    background: #1f2937;
    color: #fff;
    border: 1px solid #374151;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
  }
  .configs-btn:hover { background: #374151; }
  .configs-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 220px;
    max-width: 320px;
    max-height: 320px;
    overflow-y: auto;
    background: #fff;
    color: #111827;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    z-index: 500;
    padding: 4px;
  }
  .configs-menu.open { display: block; }
  .configs-menu .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    margin-bottom: 3px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 5px;
    cursor: pointer;
    background: var(--item-bg, #ffffff);
    border: 1px solid rgba(0,0,0,0.06);
    transition: filter 0.12s ease;
  }
  .configs-menu .item:last-child { margin-bottom: 0; }
  .configs-menu .item:hover { filter: brightness(0.95); }
  .configs-menu .item .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 8px;
  }
  .configs-menu .item .del {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
  }
  .configs-menu .item .del:hover { background: #fee2e2; color: #b91c1c; }
  .save-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    padding: 20px;
  }
  .save-modal.visible { display: flex; }
  .save-box {
    background: #fff;
    border-radius: 10px;
    padding: 20px 22px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .save-box h3 {
    margin: 0 0 14px 0;
    font-size: 16px;
    color: #111827;
  }
  .save-box label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .save-box input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .save-box input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .save-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .save-warning, .save-config-warning {
    color: #c2410c;
    font-size: 12px;
    font-weight: 600;
    margin-top: 6px;
    display: none;
  }
  .save-warning.visible, .save-config-warning.visible { display: inline-block; }
  .save-config-warning {
    margin-top: 0;
    margin-left: 4px;
    align-self: center;
  }
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px;
  }
  .section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .section h2 {
    margin: 0 0 14px 0;
    font-size: 15px;
    font-weight: 700;
    color: #111827;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .grid-fields {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px 18px;
  }
  .field { display: flex; flex-direction: column; }
  .field.wide { grid-column: span 4; }
  .field label {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: #111827;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field small { color: #6b7280; font-size: 11px; margin-top: 4px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    padding: 9px 16px;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, border-color 0.12s;
  }
  button:hover:not(:disabled) { background: #f3f4f6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: #2563eb;
    color: #fff;
    border-color: #2563eb;
  }
  button#startBtn {
    min-width: 180px;
    padding-left: 32px;
    padding-right: 32px;
  }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button.danger {
    background: #fff;
    color: #b91c1c;
    border-color: #fca5a5;
  }
  button.danger:hover:not(:disabled) { background: #fef2f2; }
  .status {
    margin-left: auto;
    font-size: 13px;
    color: #4b5563;
  }
  .cost-counter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #0c4a6e;
  }
  .cost-counter .cost-amount { font-variant-numeric: tabular-nums; }
  .cost-counter .cost-reset {
    background: transparent;
    border: none;
    padding: 0 2px;
    margin: 0;
    color: #0c4a6e;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.6;
  }
  .cost-counter .cost-reset:hover { opacity: 1; background: transparent; }
  .balance-counter {
    background: #fef3c7;
    border-color: #fcd34d;
    color: #78350f;
  }
  .balance-clickable {
    cursor: pointer;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
  }
  .balance-clickable.balance-unset {
    font-style: italic;
    opacity: 0.75;
  }
  .error-banner {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
    font-weight: 500;
    display: none;
  }
  .error-banner.visible { display: block; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card.downloaded {
    border-color: #16a34a;
    border-width: 3px;
    box-shadow: 0 0 0 1px #16a34a;
  }
  .card.regenerated:not(.downloaded) {
    border-color: #eab308;
    border-width: 3px;
    box-shadow: 0 0 0 1px #eab308;
  }
  .card .thumb {
    width: 100%;
    aspect-ratio: 3 / 2;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9ca3af;
    font-size: 13px;
    overflow: hidden;
    position: relative;
  }
  .card .thumb .dim-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(17, 24, 39, 0.78);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 4px;
    pointer-events: none;
    letter-spacing: 0.2px;
  }
  .card .thumb .cost-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(249, 115, 22, 0.78);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 4px;
    pointer-events: none;
    letter-spacing: 0.2px;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
  .card .thumb.error { background: #fef2f2; color: #b91c1c; padding: 12px; text-align: center; font-size: 12px; }
  .card .thumb.pending::after {
    content: "";
    width: 28px; height: 28px;
    border: 3px solid #d1d5db;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card .label {
    padding: 10px 12px 6px;
    font-size: 13px;
    font-weight: 600;
    color: #2563eb;
    text-align: center;
  }
  .card .btns {
    display: flex;
    gap: 6px;
    padding: 6px 10px 10px;
  }
  .card .btns button {
    flex: 1;
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .card .btns button.btn-download {
    background: #e7f2df;
  }
  .card .btns button.btn-download:hover:not(:disabled) {
    background: #d6e9c8;
  }
  .card .btns button.btn-regen {
    background: #ffecd8;
  }
  .card .btns button.btn-regen:hover:not(:disabled) {
    background: #ffdcb8;
  }
  .card .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .card .overlay::after {
    content: "";
    width: 34px; height: 34px;
    border: 3px solid #d1d5db;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .card.loading .overlay { display: flex; }
  .preview-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 30px;
    cursor: zoom-out;
  }
  .preview-modal.visible { display: flex; }
  .preview-modal img { width: 70vw; height: 70vh; max-width: 70vw; max-height: 70vh; object-fit: contain; background: #fff; border-radius: 6px; }
  .empty-state {
    text-align: center;
    padding: 40px;
    color: #6b7280;
    font-size: 14px;
  }
  @media (max-width: 900px) {
    .grid-fields { grid-template-columns: repeat(2, 1fr); }
    .field.wide { grid-column: span 2; }
    .results-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .grid-fields { grid-template-columns: 1fr; }
    .field.wide { grid-column: span 1; }
    .results-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <span>How To Draw — Bulk Worksheet Generator <span class="version-tag">V3</span></span>
  <div id="configsWrap" class="configs-wrap">
    <button id="configsBtn" class="configs-btn" type="button">Configs ▾</button>
    <div id="configsMenu" class="configs-menu"></div>
  </div>
</header>

<main>
  <div class="section">
    <h2>Data</h2>
    <div class="grid-fields">
      <div class="field wide">
        <label for="subjects">Drawing Subjects</label>
        <textarea id="subjects" placeholder="e.g. Cute Lion, Happy Elephant, Baby Dragon"></textarea>
        <small>Comma-separated list. One worksheet is generated per subject.</small>
      </div>

      <div class="field">
        <label for="aspect">Aspect Ratio</label>
        <select id="aspect"></select>
      </div>

      <div class="field">
        <label for="steps">Drawing Steps Number</label>
        <select id="steps">
          <option>4</option><option>5</option><option>6</option>
          <option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>

      <div class="field">
        <label for="age">Target Age Range</label>
        <select id="age">
          <option>3 to 5 years old</option>
          <option selected>5 to 8 years old</option>
          <option>6 to 9 years old</option>
          <option>7 to 10 years old</option>
          <option>8 to 12 years old</option>
          <option>10+ years old</option>
        </select>
      </div>

      <div class="field">
        <label for="pathWidth">Path Width</label>
        <select id="pathWidth">
          <option>Thin uniform weight (around two points)</option>
          <option selected>Medium uniform weight (around three to four points)</option>
          <option>Thick uniform weight (around five to six points)</option>
        </select>
      </div>

      <div class="field">
        <label for="style">Drawing Style</label>
        <select id="style">
          <option selected>Kawaii Cartoon</option>
          <option>Classic Cartoon</option>
          <option>Chibi</option>
          <option>Doodle</option>
          <option>Flat Vector</option>
          <option>Storybook</option>
        </select>
      </div>

      <div class="field">
        <label for="lineStyle">Line Style</label>
        <select id="lineStyle">
          <option selected>Clean Rounded Coloring-Book Outline</option>
          <option>Bold Outline</option>
          <option>Thin Sketch Outline</option>
          <option>Uniform Vector Outline</option>
          <option>Soft Marker Outline</option>
          <option>Crayon Outline</option>
        </select>
      </div>

      <div class="field">
        <label for="model">Drawing AI Model</label>
        <select id="model">
          <option value="pro" selected>Nano Banana Pro</option>
          <option value="v2">Nano Banana 2</option>
          <option value="openai_image_2">ChatGPT Image 2.0</option>
        </select>
      </div>

      <div class="field">
        <label for="prompt">Prompt</label>
        <select id="prompt">
          <option value="black" selected>Black Steps (V8)</option>
          <option value="graysteps">GRAYED-Steps (V8)</option>
          <option value="grayblack">Gray-Black Steps (V9)</option>
        </select>
      </div>

      <div class="field">
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="1K">1K</option>
          <option value="2K" selected>2K</option>
          <option value="4K">4K</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="startBtn" class="primary" disabled>START</button>
      <button id="resetBtn">Reset</button>
      <button id="downloadAllBtn" disabled>Download All (ZIP)</button>
      <button id="saveConfigBtn" type="button">Save Config</button>
      <span id="costCounter" class="cost-counter" title="Estimated total cost in this browser tab only (not shared with other tabs). Approximate, based on Google's and OpenAI's published per-image rates.">
        <span>Total Cost:</span>
        <span class="cost-amount" id="costAmount">$0.0000</span>
        <button type="button" class="cost-reset" id="costReset" title="Reset this tab's cost counter">↺</button>
      </span>
      <span id="balanceCounter" class="cost-counter balance-counter" title="Manually-entered Gemini prepaid balance. Decremented on every successful image across all tabs in this browser. Click the value to set or update.">
        <span>Remaining Balance:</span>
        <span class="cost-amount balance-clickable" id="balanceAmount">— set —</span>
      </span>
      <span id="saveConfigWarning" class="save-config-warning"></span>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="section">
    <h2>Results</h2>
    <div id="errorBanner" class="error-banner"></div>
    <div id="resultsGrid" class="results-grid">
      <div class="empty-state">No generations yet. Enter subjects and press START.</div>
    </div>
  </div>
</main>

<div id="previewModal" class="preview-modal"><img id="previewImg" alt="" /></div>

<div id="saveModal" class="save-modal">
  <div class="save-box">
    <h3 id="saveModalTitle">Save Config</h3>
    <label for="saveNameInput">Config name:</label>
    <input id="saveNameInput" type="text" placeholder="e.g. Lions kawaii grayblack" />
    <div id="saveNameWarning" class="save-warning">This name was used before</div>
    <div class="save-actions">
      <button id="saveCancelBtn" type="button">Cancel</button>
      <button id="saveConfirmBtn" type="button" class="primary">Save</button>
    </div>
  </div>
</div>

<script>

    "DRAWING_SUBJECT": "Cute Lion",

  "prompt": {
    "shape_stability_iron_law": [
      "READ FIRST. Shape stability is the single non-negotiable rule of this worksheet: every shape, line, curve, and stroke that appears in any stage MUST appear in EVERY following stage with absolutely identical SIZE, identical PROPORTIONS, identical POSITION on the canvas, identical ORIENTATION (no rotation, no flip, no mirror), identical LINE PATH (every curve, every wobble, every bump, every endpoint, every junction), identical LINE THICKNESS, and identical visual STYLE — the only thing that ever changes about a previously-drawn line is its color flipping from pure black {{STROKE_COLOR_NEW}} to light gray {{STROKE_COLOR_PREVIOUS}}. Nothing else about its geometry, path, weight, or style may change once it has been drawn.",

    "color_law_read_this_first": [

    "color_assignment_verification_law": [
      "MANDATORY PER-STAGE COLOR VERIFICATION. Before finalizing every stage after stage one, walk every single character line on the canvas and assign it to exactly ONE of two buckets — there is no third bucket, no in-between, no exception.",
      "Bucket A — PREVIOUS-STAGE LINES (must be pure light gray {{STROKE_COLOR_PREVIOUS}}): every line that was drawn in any earlier stage. These are the cumulative lines from stage one, stage two, and so on up to and including the immediately preceding stage. Every single one of these lines MUST appear in light gray {{STROKE_COLOR_PREVIOUS}} in the current stage. Not one of them may be pure black. Not one of them may be partially black. Not one of them may be missing from the canvas. Not one of them may have moved, resized, or reshaped — only its color has flipped from black to gray.",
      "Bucket B — NEW-STAGE LINES (must be pure black {{STROKE_COLOR_NEW}}): the lines being introduced for the very first time in the current stage. These are the freshly added strokes drawn on top of the now-gray history. Every single one of these lines MUST be pure black {{STROKE_COLOR_NEW}}. Not one of them may be light gray. Not one of them may be partially gray. None of them may overlap, retrace, double-line, or re-ink any line that already belongs to Bucket A.",
      "Two-bucket completeness rule: every visible character line on the canvas in every stage after stage one belongs to exactly one of the two buckets above. There are no lines whose color is undefined, mixed, blended, gradient, partially black-and-partially-gray, or any color other than {{STROKE_COLOR_NEW}} or {{STROKE_COLOR_PREVIOUS}}. The only other color allowed anywhere on the canvas is the slightly different arrow gray {{ARROW_COLOR}} on the dotted arrows between stages.",
      "Per-stage color audit (must be performed for every stage after stage one): (a) count every pure-black character line in the current stage — this count MUST equal exactly the number of fresh strokes you intended to add in this stage; (b) count every light-gray character line in the current stage — this count MUST equal exactly the cumulative strokes drawn across all earlier stages combined. If the black count is too high, an earlier line was wrongly left in black instead of being recolored to gray — fix it. If the black count is too low, either a freshly added feature was wrongly colored gray, or a planned new feature was skipped — fix it. If the gray count is too low, an earlier line is missing from the canvas — restore it in gray. If the gray count is too high, an invented gray line with no earlier-stage ancestor was drawn — remove it.",

    "task": "Create a clean, premium-quality, print-ready step-by-step drawing worksheet that teaches a child in {{TARGET_AGE_RANGE}} how to draw a {{DRAWING_SUBJECT}} in exactly {{DRAWING_STEPS_NUMBER}} progressive stages, following the color law above. The final image must look like a polished page from a children's how-to-draw activity book that a real child can follow with a pencil — every stage must be physically drawable on top of the previous one without ever erasing.",
    "hard_constraints": [
      "Render exactly {{DRAWING_STEPS_NUMBER}} progressive drawing stages — never fewer, never more.",
      "Scale lock: every stage depicts the same character at the same size. The silhouette bounding box is identical in every stage. A stage with fewer lines must never appear smaller than a stage with more lines.",
      "Identity lock: every stage depicts the same species, same breed, same pose, same expression, same accessories, same silhouette. No species drift. No accessory or distinguishing mark appearing mid-sequence.",

      "Strict accumulation with recoloring: each stage is treated as a pixel-identical copy of the previous stage with two changes only — (a) every line that was pure black in the previous stage is recolored to light gray {{STROKE_COLOR_PREVIOUS}} in this stage, and (b) freshly added lines in this stage are pure black {{STROKE_COLOR_NEW}}. Never redraw, resize, rotate, translate, mirror, smooth, simplify, sharpen, clean up, refine, restyle, replace, or reinterpret any line that already appeared in an earlier stage. If you need a previously drawn line in a later stage, you reuse the exact same line — same coordinates, same length, same curvature, same endpoints, same thickness — only its color flips from black to gray.",
      "Orientation lock: the {{DRAWING_SUBJECT}} faces the same direction in every single stage of the worksheet. The character is never flipped horizontally (left-right mirrored) and never flipped vertically (upside-down mirrored) between stages. If the character faces left in stage one, it faces left in every following stage. If it faces right in stage one, it faces right in every following stage. Same head tilt, same body angle, same eye direction, same nose direction, same tail direction, same paw or limb orientation in every stage.",
      "Color-history lock: a line is pure black in exactly ONE stage (the stage in which it was introduced) and light gray in every stage after. A gray line never goes back to black in any later stage. Within a single stage, every individual line is ENTIRELY pure black or ENTIRELY light gray — never partially both, never blended, never gradient.",
      "No-erase rule: a child following these stages with a pencil must never have to erase or modify any line they already drew. Every later stage must add new lines that fit cleanly around or attach to existing lines without crossing through, replacing, or contradicting them.",

    "stage_to_stage_visual_continuity_critical": [
      "READ THIS BEFORE DRAWING ANY STAGE. The single most important rule of this worksheet is visual continuity from one stage to the next. A child must be able to look at any stage and see THE EXACT SAME DRAWING they saw in the previous stage — every line in exactly the same place — with the only differences being that the previously-black lines have faded to gray and a few fresh black lines have been added on top.",
      "Mental model: imagine that stage one was drawn on a real sheet of paper in pure black ink. To produce stage two, that exact sheet of paper is photocopied 1:1 onto a fresh sheet, but the photocopier reproduces the previous black lines in light gray instead of black. Then, and only then, are the new stage-two lines drawn on top of the photocopy in fresh pure black. To produce stage three, the stage-two sheet is photocopied 1:1 again with the same gray-fade effect (so the previous-stage black lines now also fade to gray, joining the already-gray older lines), and the new stage-three lines are added on top in fresh black. And so on. Every stage is the gray-faded photocopy of the previous stage plus only the new black strokes of that stage. There is no other source of difference between stages.",
      "Every line introduced in any earlier stage must remain in every following stage with all of these properties IDENTICAL: position on the canvas, length, width, height, orientation, rotation, curvature, smoothness, every bump and every dip, every endpoint, every junction with another line, and line thickness. The only thing that changes about an earlier line is its color: it becomes light gray from the stage immediately after the one in which it was introduced, and it stays light gray forever after. Not approximately the same shape — exactly the same shape.",
      "Do not improve, polish, neaten, smooth, round, sharpen, simplify, regularize, symmetrize, beautify, redraw more carefully, or visually upgrade any earlier line in a later stage. Even if the earlier line looks slightly imperfect or could be drawn better, it must be reproduced unchanged in shape and only recolored to gray. The earlier stage is the source of truth — never the target of revision.",
      "Do not nudge, shift, slide, drift, recenter, rebalance, re-anchor, or reposition any earlier line by even a single pixel. The character's anchor point in stage two is exactly the anchor point of stage one. The character's anchor point in stage three is exactly the anchor point of stage two. And so on.",
      "Do not rescale any earlier line. The head circle from stage one is the same circle in stage two — same diameter, same center, same shape, same outline thickness — only recolored from black to gray. Not slightly larger, not slightly smaller, not slightly rounder, not slightly more oval.",
      "Do not flip, mirror, or change the facing direction of the character or any of its parts between stages. The whole character keeps the exact same orientation in every stage — never horizontally mirrored (left to right or right to left), never vertically mirrored (upside down or right side up swap), never rotated by any angle. Every individual line keeps the exact same direction it had when first drawn: a curve that opens to the left in stage one still opens to the left in every later stage; a tail that sweeps to the right in an early stage still sweeps to the right in every later stage; a face looking left in an early stage still looks left in every later stage. Mirroring the character as a whole, or mirroring any part of it, is treated as a complete failure of the worksheet.",
      "Do not restyle any earlier line. If stage one's head outline has a particular wobble or a particular curve, stage two's head outline has that exact same wobble and that exact same curve, only recolored to gray. Do not switch from a hand-drawn feel to a vector feel between stages, or from a slightly loose curve to a perfect arc, or from one line weight to another.",
      "Do not re-ink, retrace, double-line, or re-outline any previously-drawn line in a later stage. A line that was already drawn in an earlier stage must not be drawn again over the top of itself in black or in any color. The next stage's black ink only goes onto FRESH areas of the page that no previous line has touched.",
      "When a later stage adds a feature that touches or attaches to an earlier (now gray) line, the new black feature must connect to the earlier gray line at the exact endpoints already present in that line, with the earlier gray line itself remaining 100% unchanged in shape. Do not extend, shorten, or re-end any earlier line to make the connection cleaner — instead, plan the earlier line so the connection is already clean.",
      "If at any point you find yourself wanting to redraw an earlier line because the new feature would fit better, STOP. The correct fix is never to redraw the earlier line — the correct fix is to go back and re-plan the earlier stage so the line was placed correctly from the start.",
      "Stage validation test: if you mentally subtract a later stage from the previous stage, the only differences must be (a) every previously-black line is now gray, and (b) freshly added lines of the later stage are black. Subtracting must NEVER reveal that an earlier line moved, resized, rotated, smoothed, mirrored, or changed style. If subtraction reveals any change to an earlier line beyond the black-to-gray recolor, the worksheet is wrong and must be redone.",
      "Forbidden continuity failures: head circle slightly larger or smaller in a later stage; body oval slightly more rounded or more elongated in a later stage; an earlier wobbly outline replaced with a smoother one in a later stage; a feature in a later stage drawn over the earlier line as a corrected version; the character drifting a few pixels left, right, up, or down between stages; the character's center of gravity shifting between stages; the line weight of an earlier line getting thicker or thinner in a later stage; an earlier line being broken into segments or fused into one continuous curve in a later stage; an earlier line still appearing in pure black in a later stage instead of gray; a previously-gray line turning back to black in a still-later stage."
    ],
    "step_to_step_completion_ease": [
      "When planning each stage, think about how the NEXT stage will be added by a child holding a pencil. The child should look at the current stage, immediately see where the new black lines belong, and be able to add them naturally — without confusion, without erasing, and without having to interpret an unusual or broken-looking base shape.",
      "What actually makes a stage easy to continue is good PROPORTION and good POSITION of the base shapes — not literal pre-cut gaps in the outline. A head drawn at the right size and position already implies where ears, mane, hair, eyes, or a muzzle will go. A body drawn at the right length and angle already implies where legs and tail will go. The child reads these implied attachment zones automatically.",
      "Default to clean, simple, friendly closed silhouettes in every early stage. A clean closed oval head is correct, even when ears, mane, or hair will be added later — children naturally draw ears that sit on top of a head and hair that flows along a head curve. They do NOT need a pre-cut notch to know where to put a new feature.",
      "Do NOT damage the base silhouette with awkward notches, sudden cuts, slits, scoops, or unexplained gaps just because a future feature will attach there. A broken-looking base shape confuses the child far more than a clean closed shape ever does. A child seeing a strange slit in stage one will not understand why it is there and will not know what to do with it.",
      "Two completion patterns are equally valid; choose whichever produces the cleanest, most child-friendly worksheet for the subject: (1) the new black feature in the later stage attaches OUTSIDE the earlier (now gray) closed shape, touching its outline cleanly along the surface (ears sitting on top of a closed head, legs dropping from a closed body, a tail curling away from a closed body, hair lying along the top of a closed head, a mane flowing down the side of a closed neck); (2) the new black feature in the later stage sits ENTIRELY INSIDE the earlier (now gray) closed shape (eyes, nose, mouth, cheeks, spots, simple inner markings, fur swirls). Both are good. Closed clean silhouettes are the safe default.",
      "Only use a genuinely open shape (for example a cup drawn as an open U so icing fills the top, or an envelope drawn open so a card slides out) when the open shape itself is a recognizable, intentional, friendly choice — not a closed shape with a piece chopped out. If in doubt, draw the clean closed base shape.",
      "If a later stage adds a feature that touches an earlier outline (ears, hair, limbs, tail, mane), the new black feature simply touches that gray outline at its surface. The earlier gray outline stays exactly as it was, and the new black feature is drawn alongside it without crossing it inward. This is the natural way children draw — touching at the edge, not piercing through.",
      "Self-test before finalizing any stage: would a 5-to-8 year old looking only at this stage understand it as a clean recognizable shape? Would they be able to add the next features by simply touching or filling, without erasing and without wondering why a notch is there? If the answer is yes, the stage is well-planned. If the stage looks broken, scooped, slit, or arbitrarily interrupted, redo it as a clean closed shape."
    ],
    "stage_by_stage_script": [
      "Before drawing any stage, decide whether the {{DRAWING_SUBJECT}} is an ANIMAL or a HUMAN. Animals are any real or fictional creature with recognizable animal anatomy: lions, cats, dogs, horses, cows, pigs, rabbits, mice, bears, monkeys, foxes, deer, elephants, giraffes, dinosaurs, dragons, unicorns, fish, sharks, whales, dolphins, frogs, turtles, snakes, lizards, birds, owls, eagles, penguins, butterflies, bees, ladybugs, spiders, crabs, octopuses, and any other creature with an animal-like body. Humans are any real or fictional person: boys, girls, men, women, babies, kids, princesses, princes, knights, astronauts, doctors, athletes, fairies, mermaids, and any other person-shaped subject. ALL OTHER subjects — vehicles (cars, planes, trains, boats, rockets), toys (balls, blocks, kites, dolls, teddy bears interpreted as toys), objects (cups, bottles, lamps, books, tools, instruments, backpacks, hats, shoes, furniture), plants (flowers, trees, mushrooms, leaves), food (apples, cakes, ice cream, sandwiches), buildings (houses, castles, towers, bridges), robots, machines, monsters, abstract creatures, and anything else that is NOT clearly an animal or a human — are FACE-LESS subjects. Face-less subjects must NEVER be drawn with any facial feature whatsoever — no eyes, no pupils, no eyebrows, no nose, no mouth, no smile, no kawaii expression — at any stage, in any color, regardless of how cute or playful the drawing style is. The simplification rule is strict: when in doubt about whether a subject is an animal/human or something else, treat it as face-less. This decision controls the role of the third and fourth stages described below.",
      "Stage one (all pure black): draw ONLY the largest one or two base blobs of the character — for example, one oval for the head and one oval for the body, or a single rounded body mass. Plain open outlines in pure black {{STROKE_COLOR_NEW}}. No face, no eyes, no ears, no limbs, no tail, no mane, no hair, no fur tufts, no wings, no accessories, no decorations, no texture marks. The first-stage shape is drawn as a clean, friendly, closed silhouette with proportions and positioning that already imply where future features will naturally attach.",
      "Stage two: the exact same base blobs from stage one now appear in light gray {{STROKE_COLOR_PREVIOUS}} (unchanged in shape, size, position, orientation). In pure black {{STROKE_COLOR_NEW}}, add the major structural contours — head contour lines, neck, body contour, limbs, tail, ears, mane outline — whichever large outer contours the character has. Still no face. New external shapes attach naturally along the outside of the previous stage's silhouette by touching it at the surface — the previous outline is never broken, notched, or interrupted to make room for them.",
      "Stage three rule for face-bearing subjects: when the {{DRAWING_SUBJECT}} has a face, all lines from stages one and two now appear in light gray {{STROKE_COLOR_PREVIOUS}} (unchanged in shape and position). In pure black {{STROKE_COLOR_NEW}}, add NON-FACIAL identity markers and structural details that make the species or character recognizable WITHOUT yet drawing any part of the face. These can include: hair locks or fringe, mane segments, fur tufts or fur direction lines, spots or stripes pattern, scales pattern, feather rows, horn or antler details, ear inner shapes, paw pads, claws, hooves, fingers, accessory details (collars, bows, hats, glasses frames WITHOUT lenses-as-eyes), clothing folds, wing feathers, fin rays, shell segments, tail tufts, decorative markings on the body. The HEAD area in stage three contains only non-facial elements (such as hair, hat, ears, horns, tuft on top of the head) and the face area itself remains completely BLANK — no eyes, no nose, no mouth, no eyebrows, no whiskers, no cheeks, no muzzle line, no chin line, no smile, nothing on the face surface, neither in black nor in gray.",
      "Stage three rule for face-less subjects: when the {{DRAWING_SUBJECT}} does not have a face, all lines from stages one and two now appear in light gray {{STROKE_COLOR_PREVIOUS}}. In pure black {{STROKE_COLOR_NEW}}, add the medium structural details and identity markers appropriate to the object (handle of a cup, label area of a bottle, laces of a shoe, buttons of a shirt, panel lines of a vehicle without eyes, branches of a tree, etc.) — exactly as it would in a normal worksheet.",
      "Stage four rule for face-bearing subjects: when the {{DRAWING_SUBJECT}} has a face, all lines from stages one, two, and three now appear in light gray {{STROKE_COLOR_PREVIOUS}} (unchanged). In pure black {{STROKE_COLOR_NEW}}, add ALL facial features for the first time — eyes (with pupils and any highlights), eyebrows if present, nose or snout details, mouth or smile line, tongue or teeth if shown, whiskers, blush or cheek dots, freckles, beak details, fangs, chin line — together with any remaining small finishing details elsewhere on the body. The face appearing in stage four is the moment the character finally comes alive: a child finishing this stage instantly recognizes the personality of the {{DRAWING_SUBJECT}} for the first time. All facial features sit entirely inside the head shape (now gray); the head outline is never modified to accommodate them.",
      "Stage four rule for face-less subjects: when the {{DRAWING_SUBJECT}} does not have a face, all lines from stages one, two, and three now appear in light gray {{STROKE_COLOR_PREVIOUS}}. In pure black {{STROKE_COLOR_NEW}}, add the small finishing details that were not yet present (small surface details, texture hints expressed as discrete lines, small accessory details, etc.).",
      "For more than four stages, split the middle structural phase across more stages; keep stage one minimal; reserve the FINAL stage for the entire face (for face-bearing subjects) plus any small finishing details. The face still appears for the first time only in the final stage.",
      "For three stages, merge the middle two stages: stage one = base blobs in pure black; stage two = full body contours plus all non-facial identity markers in pure black (with stage one in gray); stage three = the face for face-bearing subjects (or finishing details for face-less subjects) in pure black, with everything earlier now in gray."
    ],

      "READ THIS BEFORE DRAWING ANY STAGE. The single most important rule of this worksheet is visual continuity from one stage to the next. A child must be able to look at any stage and see THE EXACT SAME DRAWING they saw in the previous stage — every line in exactly the same place — with the only differences being that the previously-black lines have faded to light gray and a few fresh black lines have been added on top.",
      "Mental model: imagine that stage one was drawn on a real sheet of paper in pure black ink. To produce stage two, that exact sheet of paper is photocopied 1:1 onto a fresh sheet, but the photocopier reproduces every black line as light gray instead of black. Then, and only then, are the new stage-two lines drawn on top of the photocopy in fresh pure black. To produce stage three, the stage-two sheet is photocopied 1:1 again with the same gray-fade effect (so the previous-stage black lines now also fade to gray, joining the already-gray older lines), and the new stage-three lines are added on top in fresh black. And so on. Every stage is the gray-faded photocopy of the previous stage plus only the new black strokes of that stage. There is no other source of difference between stages.",
      "Every line introduced in any earlier stage must remain in every following stage with all of these properties IDENTICAL: position on the canvas, length, width, height, orientation, rotation, curvature, smoothness, every bump and every dip, every endpoint, every junction with another line, and line thickness. The only thing that changes about an earlier line is its color: it becomes light gray from the stage immediately after the one in which it was introduced, and it stays light gray forever after. Not approximately the same shape — exactly the same shape.",
      "Do not improve, polish, neaten, smooth, round, sharpen, simplify, regularize, symmetrize, beautify, redraw more carefully, or visually upgrade any earlier line in a later stage. Even if the earlier line looks slightly imperfect or could be drawn better, it must be reproduced unchanged. The earlier stage is the source of truth — never the target of revision.",
      "Do not nudge, shift, slide, drift, recenter, rebalance, re-anchor, or reposition any earlier line by even a single pixel. The character's anchor point in stage two is exactly the anchor point of stage one. The character's anchor point in stage three is exactly the anchor point of stage two. And so on.",
      "Do not rescale any earlier line. The head circle from stage one is the same circle in stage two — same diameter, same center, same shape, same outline thickness. Not slightly larger, not slightly smaller, not slightly rounder, not slightly more oval.",
      "Do not flip, mirror, or change the facing direction of the character or any of its parts between stages. The whole character keeps the exact same orientation in every stage — never horizontally mirrored (left to right or right to left), never vertically mirrored (upside down or right side up swap), never rotated by any angle. Every individual line keeps the exact same direction it had when first drawn: a curve that opens to the left in stage one still opens to the left in every later stage; a tail that sweeps to the right in an early stage still sweeps to the right in every later stage; a face looking left in an early stage still looks left in every later stage. Mirroring the character as a whole, or mirroring any part of it, is treated as a complete failure of the worksheet.",
      "Do not restyle any earlier line. If stage one's head outline has a particular wobble or a particular curve, stage two's head outline has that exact same wobble and that exact same curve. Do not switch from a hand-drawn feel to a vector feel between stages, or from a slightly loose curve to a perfect arc, or from one line weight to another.",
      "When a later stage adds a feature that touches or attaches to an earlier line, the new feature must connect to the earlier line at the exact endpoints already present in that line, with the earlier line itself remaining 100% unchanged. Do not extend, shorten, or re-end any earlier line to make the connection cleaner — instead, plan the earlier line so the connection is already clean (see the welcoming-socket section below).",
      "If at any point you find yourself wanting to redraw an earlier line because the new feature would fit better, STOP. The correct fix is never to redraw the earlier line — the correct fix is to go back and re-plan the earlier stage so the line was placed correctly from the start.",
      "Do not re-ink, retrace, double-line, or re-outline any previously-drawn line in a later stage. A line that was already drawn in an earlier stage must not be drawn again over the top of itself in black or in any color. The next stage's black ink only goes onto FRESH areas of the page that no previous line has touched.",
      "Stage validation test: if you mentally subtract a later stage from the previous stage, the only differences must be (a) every previously-black line is now gray, and (b) freshly added lines of the later stage are black. Subtracting must NEVER reveal that an earlier line moved, resized, rotated, smoothed, mirrored, or changed style. If subtraction reveals any change to an earlier line beyond the black-to-gray recolor, the worksheet is wrong and must be redone.",
      "Forbidden continuity failures: head circle slightly larger or smaller in a later stage; body oval slightly more rounded or more elongated in a later stage; an earlier wobbly outline replaced with a smoother one in a later stage; a feature in a later stage drawn over the earlier line as a corrected version; the character drifting a few pixels left, right, up, or down between stages; the character's center of gravity shifting between stages; the line weight of an earlier line getting thicker or thinner in a later stage; an earlier line being broken into segments or fused into one continuous curve in a later stage; an earlier line still appearing in pure black in a later stage instead of light gray; a previously-gray line turning back to pure black in a still-later stage."
    ],
    "step_to_step_completion_ease": [
      "When planning each stage, think about how the NEXT stage will be added by a child holding a pencil. The child should look at the current stage, immediately see where the new lines belong, and be able to add them naturally — without confusion, without erasing, and without having to interpret an unusual or broken-looking base shape.",
      "What actually makes a stage easy to continue is good PROPORTION and good POSITION of the base shapes — not literal pre-cut gaps in the outline. A head drawn at the right size and position already implies where ears, mane, hair, eyes, or a muzzle will go. A body drawn at the right length and angle already implies where legs and tail will go. The child reads these implied attachment zones automatically.",
      "Default to clean, simple, friendly closed silhouettes in every early stage. A clean closed oval head is correct, even when ears, mane, or hair will be added later — children naturally draw ears that sit on top of a head and hair that flows along a head curve. They do NOT need a pre-cut notch to know where to put a new feature.",
      "Do NOT damage the base silhouette with awkward notches, sudden cuts, slits, scoops, or unexplained gaps just because a future feature will attach there. A broken-looking base shape confuses the child far more than a clean closed shape ever does. A child seeing a strange slit in stage one will not understand why it is there and will not know what to do with it.",
      "Two completion patterns are equally valid; choose whichever produces the cleanest, most child-friendly worksheet for the subject: (1) the new feature in the later stage attaches OUTSIDE the earlier closed shape, touching its outline cleanly along the surface (ears sitting on top of a closed head, legs dropping from a closed body, a tail curling away from a closed body, hair lying along the top of a closed head, a mane flowing down the side of a closed neck); (2) the new feature in the later stage sits ENTIRELY INSIDE the earlier closed shape (eyes, nose, mouth, cheeks, spots, simple inner markings, fur swirls). Both are good. Closed clean silhouettes are the safe default.",
      "Only use a genuinely open shape (for example a cup drawn as an open U so icing fills the top, or an envelope drawn open so a card slides out) when the open shape itself is a recognizable, intentional, friendly choice — not a closed shape with a piece chopped out. If in doubt, draw the clean closed base shape.",
      "If a later stage adds a feature that touches an earlier outline (ears, hair, limbs, tail, mane), the new feature simply touches that outline at its surface. The earlier outline stays exactly as it was, and the new feature is drawn alongside it without crossing it inward. This is the natural way children draw — touching at the edge, not piercing through.",
      "Self-test before finalizing any stage: would a 5-to-8 year old looking only at this stage understand it as a clean recognizable shape? Would they be able to add the next features by simply touching or filling, without erasing and without wondering why a notch is there? If the answer is yes, the stage is well-planned. If the stage looks broken, scooped, slit, or arbitrarily interrupted, redo it as a clean closed shape."
    ],

    "arrows_critical": [
      "Arrows are CRITICAL. Get the count, the color, the style, and the direction exactly right. Do not improvise.",
      "Total arrow count: draw EXACTLY {{DRAWING_STEPS_NUMBER}} minus 1 arrows on the entire canvas — never more, never fewer. For a four-stage worksheet this means EXACTLY 3 arrows. For a three-stage worksheet, EXACTLY 2 arrows. For a five-stage worksheet, EXACTLY 4 arrows. Count them before finalizing.",
      "Each arrow connects exactly one consecutive pair of stages: arrow 1 goes from stage 1 to stage 2, arrow 2 goes from stage 2 to stage 3, arrow 3 goes from stage 3 to stage 4, and so on. Never draw an arrow between non-consecutive stages. Never draw an arrow from the final stage back to any earlier stage. Never draw a closing or looping arrow that returns to stage 1.",
      "Arrow style: dotted line (a sequence of small round dots evenly spaced), softly curved (a gentle arc, not a sharp angle, not a perfectly straight segment), with a single small simple arrowhead at the destination end only. No double-headed arrows. No solid lines. No dashed lines. No thick painted strokes. No fancy decorative arrows.",
      "Arrow color: every arrow and every arrowhead is exactly {{ARROW_COLOR}} — a soft medium gray, slightly darker than the previous-line gray {{STROKE_COLOR_PREVIOUS}} so the eye can tell arrows apart from the gray history of the character. Never pure black. Never the light gray {{STROKE_COLOR_PREVIOUS}}. Never any other color.",
      "Arrow size: arrows are clearly visible but visually quieter than the character linework. The dot diameter and arrowhead size are noticeably smaller than {{PATH_WIDTH}} so the eye reads the character as the main subject and the arrows as secondary guidance.",
      "Arrow placement: each arrow sits in the empty space between the two stages it connects, following the staggered N reading flow. Arrows never cross any drawn character line, never cross another arrow, and never overlap the silhouette of any stage.",
      "Forbidden arrow mistakes: drawing four or more arrows in a four-stage worksheet; drawing a closing arrow from the final stage; drawing any arrow that loops back; drawing duplicate arrows between the same pair of stages; drawing arrows in pure black; drawing solid or dashed arrows instead of dotted; drawing straight arrows instead of softly curved; drawing arrows with arrowheads at both ends; drawing arrows that cross the character or another arrow."
    ],
    "step_construction_logic": [
      "Before drawing any stage, decide whether the {{DRAWING_SUBJECT}} is an ANIMAL or a HUMAN. Animals are any real or fictional creature with recognizable animal anatomy: lions, cats, dogs, horses, cows, pigs, rabbits, mice, bears, monkeys, foxes, deer, elephants, giraffes, dinosaurs, dragons, unicorns, fish, sharks, whales, dolphins, frogs, turtles, snakes, lizards, birds, owls, eagles, penguins, butterflies, bees, ladybugs, spiders, crabs, octopuses, and any other creature with an animal-like body. Humans are any real or fictional person: boys, girls, men, women, babies, kids, princesses, princes, knights, astronauts, doctors, athletes, fairies, mermaids, and any other person-shaped subject. ALL OTHER subjects — vehicles (cars, planes, trains, boats, rockets), toys (balls, blocks, kites, dolls, teddy bears interpreted as toys), objects (cups, bottles, lamps, books, tools, instruments, backpacks, hats, shoes, furniture), plants (flowers, trees, mushrooms, leaves), food (apples, cakes, ice cream, sandwiches), buildings (houses, castles, towers, bridges), robots, machines, monsters, abstract creatures, and anything else that is NOT clearly an animal or a human — are FACE-LESS subjects. Face-less subjects must NEVER be drawn with any facial feature whatsoever — no eyes, no pupils, no eyebrows, no nose, no mouth, no smile, no kawaii expression — at any stage, in any color, regardless of how cute or playful the drawing style is. The simplification rule is strict: when in doubt about whether a subject is an animal/human or something else, treat it as face-less. This decision controls the role of the third and fourth stages described below.",
      "First stage shows only the primary simplified volume — the main head mass, body mass, or largest base shape — drawn entirely in pure black {{STROKE_COLOR_NEW}}. No facial features, no accessories, no small details. The first-stage shape is drawn as a clean, friendly, closed silhouette with proportions and positioning that already imply where future features will naturally attach. Stage one is the ONLY stage on the canvas with no light-gray lines anywhere — every line is pure black.",
      "Middle stages before the third stage: every line from earlier stages now appears in light gray {{STROKE_COLOR_PREVIOUS}} (unchanged in shape, size, position, orientation — only the color has flipped from black to gray). In pure black {{STROKE_COLOR_NEW}}, extend the base with large and medium structural shapes only, with no facial features yet. New external shapes (ears, mane, hair, limbs, tail) attach naturally along the outside of the previous stage's silhouette by touching it at the surface — the previous outline (now in gray) is never broken, notched, interrupted, or re-inked to make room for them.",
      "Third stage rule for face-bearing subjects: when the {{DRAWING_SUBJECT}} is an animal or a human, all lines from stages one and two now appear in light gray {{STROKE_COLOR_PREVIOUS}} (unchanged in shape, size, position, orientation). In pure black {{STROKE_COLOR_NEW}}, add NON-FACIAL identity markers and structural details that make the species or character recognizable WITHOUT yet drawing any part of the face. These can include: hair locks or fringe, mane segments, fur tufts or fur direction lines, spots or stripes pattern, scales pattern, feather rows, horn or antler details, ear inner shapes, paw pads, claws, hooves, fingers, accessory details (collars, bows, hats, glasses frames WITHOUT lenses-as-eyes), clothing folds, wing feathers, fin rays, shell segments, tail tufts, decorative markings on the body. The HEAD area in stage three contains only non-facial elements (such as hair, hat, ears, horns, tuft on top of the head) and the face area itself remains completely BLANK in any color — no eyes, no nose, no mouth, no eyebrows, no whiskers, no cheeks, no muzzle line, no chin line, no smile, nothing on the face surface.",
      "Third stage rule for face-less subjects: when the {{DRAWING_SUBJECT}} is anything other than an animal or a human, all lines from stages one and two now appear in light gray {{STROKE_COLOR_PREVIOUS}}. In pure black {{STROKE_COLOR_NEW}}, add the medium structural details and identity markers appropriate to the object (handle of a cup, label area of a bottle, laces of a shoe, buttons of a shirt, panel lines of a vehicle, branches of a tree, etc.) — exactly as it would in a normal worksheet.",
      "Fourth stage rule for face-bearing subjects: when the {{DRAWING_SUBJECT}} is an animal or a human, all lines from stages one, two, and three now appear in light gray {{STROKE_COLOR_PREVIOUS}}. In pure black {{STROKE_COLOR_NEW}}, add ALL facial features for the first time — eyes (with pupils and any highlights), eyebrows if present, nose or snout details, mouth or smile line, tongue or teeth if shown, whiskers, blush or cheek dots, freckles, beak details, fangs, chin line — together with any remaining small finishing details elsewhere on the body. The face appearing in stage four (in fresh pure black on top of the now-gray head) is the moment the character finally comes alive: a child finishing this stage instantly recognizes the personality of the {{DRAWING_SUBJECT}} for the first time. All facial features sit entirely inside the head shape (now gray); the head outline is never modified to accommodate them.",
      "Fourth stage rule for face-less subjects: when the {{DRAWING_SUBJECT}} is anything other than an animal or a human, all lines from stages one, two, and three now appear in light gray {{STROKE_COLOR_PREVIOUS}}. In pure black {{STROKE_COLOR_NEW}}, add the small finishing details that were not yet present (small surface details, texture hints expressed as discrete lines, small accessory details, etc.).",
      "Every stage must clearly build toward the final complete {{DRAWING_SUBJECT}} as a pixel-identical photocopy of the previous stage with previously-black lines now in light gray and only new black lines added on top — no line from any earlier stage may be altered, redrawn, repositioned, rescaled, restyled, smoothed, or upgraded in any way (only its color flips from black to gray), and the child must never be forced to erase anything they previously drew."
