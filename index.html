/* ===========================================================
   Prompt flattening + variable substitution

   The prompt is split into two parts so that Gemini's implicit prompt
   caching can hit on the long static prefix shared across every subject
   in a batch:
     - STATIC PREFIX: full template with every variable substituted
       EXCEPT DRAWING_SUBJECT, which becomes the placeholder [SUBJECT].
     - DYNAMIC SUFFIX: a tiny per-request line binding [SUBJECT] to the
       actual subject ("Cute Lion", etc.).
   Both parts are sent inside the same user message, the static one
   first so Google's tokenizer sees an identical prefix every time.
   =========================================================== */
const SUBJECT_PLACEHOLDER = "[SUBJECT]";

function substituteVars(text, vars) {
  return text.replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] !== undefined ? String(vars[k]) : "");
}

function flattenPromptStatic(template, vars) {
  const varsWithoutSubject = { ...vars, DRAWING_SUBJECT: SUBJECT_PLACEHOLDER };
  const lines = [];
  lines.push("## SUBJECT REFERENCE");
  lines.push(`Throughout this prompt, ${SUBJECT_PLACEHOLDER} is a placeholder for the specific subject the child will draw. The actual value of ${SUBJECT_PLACEHOLDER} is given in the SUBJECT TO DRAW section at the very end of this message.`);
  lines.push("");

  const p = template.prompt;
  for (const key of Object.keys(p)) {
    const val = p[key];
    const heading = key.replace(/_/g, " ").toUpperCase();
    lines.push(`## ${heading}`);
    if (Array.isArray(val)) {
      for (const item of val) lines.push("- " + item);
    } else {
      lines.push(val);
    }
    lines.push("");
  }
  if (template.negative_prompt) {
    lines.push("## NEGATIVE PROMPT (DO NOT INCLUDE ANY OF THESE)");
    lines.push(template.negative_prompt);
  }
  return substituteVars(lines.join("\n"), varsWithoutSubject);
}

function buildSubjectSuffix(subject) {
  return `\n\n## SUBJECT TO DRAW\n${SUBJECT_PLACEHOLDER} = ${subject}\n`;
}

/* ===========================================================
   OpenAI-tailored prompt construction

   Why this is different from the Gemini path:

   1. The OpenAI Image API caps `prompt` at 32,000 characters. The full
      V7/V9 templates land around 36 KB once flattened — too long.
      We drop the giant negative_prompt block (it dominates the size)
      and replace it with a short, dense critical-negatives line.

   2. gpt-image-2 is a "thinking" model that plans before drawing.
      The placeholder-then-bind-at-the-end trick used for Gemini's
      implicit prompt cache means the actual subject (and the per-call
      style/age/line-style) end up buried after 30 KB of rules — the
      model latches onto the rules and ignores the per-call options.
      Here we (a) substitute every variable INCLUDING DRAWING_SUBJECT
      directly, and (b) lead the prompt with a compact options block
      so the most important per-call signals are the first thing read.

   3. We restate the subject and the key options at the very end so
      they sit at both ends of the model's attention window.

   The original Prompt_V7.json / Prompt_V9_GrayBlack.json files and the
   embedded constants are NOT modified — this is a runtime-only
   transformation applied solely on the OpenAI code path.
   =========================================================== */
const OPENAI_PROMPT_MAX = 32000;
const OPENAI_PROMPT_SAFETY = 500;

const OPENAI_CRITICAL_NEGATIVES = [
  "text, words, letters, digits, numerals, stage numbers, captions, labels, watermarks, logos",
  "borders, frames, panels, boxes, grid lines, visible dividers between stages",
  "background scene, decorations, sparkles, stars, hearts, speech bubbles",
  "shadows, shading, gradients, color fill, any color other than the specified stroke colors, paper texture",
  "fewer or more than the requested number of stages",
  "character flipped or mirrored horizontally between stages",
  "character flipped or mirrored vertically between stages",
  "character rotated between stages",
  "character species, pose, expression, or proportion change between stages",
  "character drifting, recentered, or rescaled between stages",
  "earlier lines redrawn, retraced, smoothed, restyled, or moved in later stages",
  "awkward notches, slits, scoops, or unexplained gaps cut into early-stage outlines",
  "more arrows than (number of stages minus one)",
  "closing or looping arrows from the final stage back to an earlier stage",
  "straight, dashed, double-headed, or pure-black arrows",
  "off-white, cream, or transparent background",
  "decorative props (flowers, hearts, stars, food, hats, bows) added unless explicitly part of the subject"
].join("; ");

function buildOpenAIPrompt(template, vars, subject) {
  const allVars = { ...vars, DRAWING_SUBJECT: subject };
  const lines = [];

  // Lead with the per-call options so the model latches onto them first.
  lines.push("# WORKSHEET TO GENERATE");
  lines.push(`Subject to draw: ${subject}`);
  lines.push(`Number of progressive stages: ${vars.DRAWING_STEPS_NUMBER}`);
  lines.push(`Target child age range: ${vars.TARGET_AGE_RANGE}`);
  lines.push(`Drawing style: ${vars.DRAWING_STYLE}`);
  lines.push(`Line style: ${vars.LINE_STYLE}`);
  lines.push(`Stroke width: ${vars.PATH_WIDTH}`);
  lines.push(`Background color: ${vars.BACKGROUND}`);
  lines.push("");
  lines.push("Detailed worksheet specification follows.");
  lines.push("");

  // Walk the template sections, substituting EVERY variable directly.
  const p = template.prompt;
  for (const key of Object.keys(p)) {
    const val = p[key];
    const heading = key.replace(/_/g, " ").toUpperCase();
    lines.push(`## ${heading}`);
    if (Array.isArray(val)) {
      for (const item of val) lines.push("- " + item);
    } else {
      lines.push(val);
    }
    lines.push("");
  }

  // Compact critical-negatives line in place of the giant negative_prompt block.
  lines.push("## ABSOLUTELY DO NOT INCLUDE");
  lines.push(OPENAI_CRITICAL_NEGATIVES);
  lines.push("");

  // Restate the most important per-call options at the very end.
  lines.push(`# FINAL REMINDER`);
  lines.push(`The subject of this worksheet is: ${subject}.`);
  lines.push(`Render exactly ${vars.DRAWING_STEPS_NUMBER} progressive stages, in the ${vars.DRAWING_STYLE} style, with a ${vars.LINE_STYLE} line treatment, suited to children aged ${vars.TARGET_AGE_RANGE}.`);

  let out = substituteVars(lines.join("\n"), allVars);

  // Defensive: hard-truncate if a future template change pushes us over the cap.
  const limit = OPENAI_PROMPT_MAX - OPENAI_PROMPT_SAFETY;
  if (out.length > limit) {
    console.warn(`[OpenAI] prompt is ${out.length} chars, exceeds soft cap ${limit}; truncating.`);
    // Keep the lead and final reminder; trim from the middle.
    const finalReminder = `\n\n# FINAL REMINDER\nThe subject of this worksheet is: ${subject}.\nRender exactly ${vars.DRAWING_STEPS_NUMBER} progressive stages, in the ${vars.DRAWING_STYLE} style, with a ${vars.LINE_STYLE} line treatment, suited to children aged ${vars.TARGET_AGE_RANGE}.`;
    out = out.slice(0, limit - finalReminder.length) + finalReminder;
  }
  return out;
}

/* ===========================================================
   Gemini API call
   =========================================================== */
async function callGeminiImage(modelKey, staticText, dynamicText, selectedRatio, quality) {
  const modelId = MODEL_MAP[modelKey];
  const supported = SUPPORTED_RATIOS[modelKey] || [];
  const apiRatio = supported.includes(selectedRatio) ? selectedRatio : API_FALLBACK_RATIO;
  const imageSize = ["1K", "2K", "4K"].includes(quality) ? quality : "2K";
  console.log("[Gemini request]", { model: modelId, aspectRatio: apiRatio, imageSize: imageSize });
  const url = `${API_BASE}${modelId}:generateContent?key=${encodeURIComponent(API_KEY)}`;
  const body = {
    contents: [{
      role: "user",
      parts: [
        { text: staticText },
        { text: dynamicText }
      ]
    }],
    generationConfig: {
      responseModalities: ["IMAGE"],
      candidateCount: 1,
      imageConfig: { aspectRatio: apiRatio, imageSize: imageSize }
    }
  };
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 120000);
  let resp;
  try {
    resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: controller.signal,
      cache: "no-store",
      keepalive: false
    });
  } catch (e) {
    clearTimeout(timeoutId);
    if (e.name === "AbortError") throw new Error("Request timed out after 120s");
    throw e;
  }
  clearTimeout(timeoutId);
  if (!resp.ok) {
    const txt = await resp.text().catch(() => "");
    throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 300)}`);
  }
  const data = await resp.json();
  const parts = data?.candidates?.[0]?.content?.parts || [];
  for (const part of parts) {
    const inline = part.inlineData || part.inline_data;
    if (inline && inline.data) {
      const mime = inline.mimeType || inline.mime_type || "image/png";
      return { dataUrl: `data:${mime};base64,${inline.data}`, base64: inline.data, mime };
    }
  }
  throw new Error("No image in response");
}

/* ===========================================================
   OpenAI gpt-image-2 API call

   Endpoint: POST https://api.openai.com/v1/images/generations
   Auth: Authorization: Bearer <OPENAI_API_KEY>
   The OpenAI image API takes a single text prompt, so we concatenate
   the static and dynamic chunks (the static chunk references [SUBJECT]
   as a placeholder which the dynamic chunk binds at the very end).
   Returns { dataUrl, base64, mime, openaiSize, openaiQuality } so the
   caller can record the exact per-image cost.
   =========================================================== */
// Tier-1 OpenAI accounts hit 5 RPM on gpt-image-2. When the API answers HTTP
// 429 we transparently wait OPENAI_RATELIMIT_RETRY_MS and try again, up to
// OPENAI_RATELIMIT_MAX_RETRIES extra attempts. Other errors bubble up immediately.
const OPENAI_RATELIMIT_RETRY_MS = 15000;
const OPENAI_RATELIMIT_MAX_RETRIES = 6; // up to 7 total attempts (~1.5 min of 429s)

async function callOpenAIImage(modelKey, tpl, vars, subject, selectedRatio, quality) {
  const modelId = MODEL_MAP[modelKey];
  const apiRatio = OPENAI_RATIO_TO_SIZE[selectedRatio] ? selectedRatio : "3:2";
  const size = OPENAI_RATIO_TO_SIZE[apiRatio];
  const oaQuality = OPENAI_QUALITY_MAP[quality] || "medium";
  const fullPrompt = buildOpenAIPrompt(tpl, vars, subject);
  console.log("[OpenAI request]", { model: modelId, size: size, quality: oaQuality, promptLength: fullPrompt.length });
  if (!OPENAI_API_KEY || OPENAI_API_KEY.indexOf("sk-") !== 0) {
    throw new Error("OPENAI_API_KEY is not set in the source.");
  }
  const body = {
    model: modelId,
    prompt: fullPrompt,
    n: 1,
    size: size,
    quality: oaQuality,
    output_format: "png",
    background: "opaque"
  };

  let resp;
  let lastErrText = "";
  let attempt = 0;
  while (true) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 180000); // gpt-image-2 high quality can be slower
    try {
      resp = await fetch(OPENAI_API_BASE, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify(body),
        signal: controller.signal,
        cache: "no-store",
        keepalive: false
      });
    } catch (e) {
      clearTimeout(timeoutId);
      if (e.name === "AbortError") throw new Error("Request timed out after 180s");
      throw e;
    }
    clearTimeout(timeoutId);

    if (resp.status === 429 && attempt < OPENAI_RATELIMIT_MAX_RETRIES) {
      lastErrText = await resp.text().catch(() => "");
      attempt += 1;
      console.warn(`[OpenAI 429] rate-limited, retrying in ${OPENAI_RATELIMIT_RETRY_MS / 1000}s (attempt ${attempt}/${OPENAI_RATELIMIT_MAX_RETRIES}) — ${lastErrText.slice(0, 200)}`);
      await new Promise(r => setTimeout(r, OPENAI_RATELIMIT_RETRY_MS));
      continue;
    }
    break;
  }

  if (!resp.ok) {
    const txt = await resp.text().catch(() => "");
    throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 300)}`);
  }
  const data = await resp.json();
  const item = data?.data?.[0];
  if (!item) throw new Error("No image in response");
  if (item.b64_json) {
    const mime = "image/png";
    return {
      dataUrl: `data:${mime};base64,${item.b64_json}`,
      base64: item.b64_json,
      mime: mime,
      openaiSize: size,
      openaiQuality: oaQuality
    };
  }
  if (item.url) {
    // Fetch and inline so the rest of the pipeline (preview/ZIP/regenerate) keeps working uniformly.
    const imgResp = await fetch(item.url, { cache: "no-store" });
    if (!imgResp.ok) throw new Error(`Failed to fetch image URL: HTTP ${imgResp.status}`);
    const blob = await imgResp.blob();
    const buf = await blob.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = "";
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const b64 = btoa(bin);
    const mime = blob.type || "image/png";
    return {
      dataUrl: `data:${mime};base64,${b64}`,
      base64: b64,
      mime: mime,
      openaiSize: size,
      openaiQuality: oaQuality
    };
  }
  throw new Error("No image in response");
}

/* Dispatcher: pick the right backend based on the model key.
   The Gemini path keeps its static + dynamic split (preserves implicit
   prompt-cache benefits across batches of subjects). The OpenAI path
   builds its own subject-led prompt from the template + vars. */
async function callImageModel(modelKey, tpl, vars, subject, selectedRatio, quality) {
  if (modelKey === "openai_image_2") {
    return await callOpenAIImage(modelKey, tpl, vars, subject, selectedRatio, quality);
  }
  const staticText = flattenPromptStatic(tpl, vars);
  const dynamicText = buildSubjectSuffix(subject);
  return await callGeminiImage(modelKey, staticText, dynamicText, selectedRatio, quality);
}

/* ===========================================================
   Subject generation pipeline
   =========================================================== */
function readConfig() {
  const subjects = document.getElementById("subjects").value
    .split(",").map(s => s.trim()).filter(Boolean);
  const aspect = document.getElementById("aspect").value.trim();
  const steps = parseInt(document.getElementById("steps").value, 10);
  const age = document.getElementById("age").value;
  const pathWidth = document.getElementById("pathWidth").value;
  const style = document.getElementById("style").value;
  const lineStyle = document.getElementById("lineStyle").value;
  const model = document.getElementById("model").value;
  const prompt = document.getElementById("prompt").value;
  const quality = document.getElementById("quality").value;
  return { subjects, aspect, steps, age, pathWidth, style, lineStyle, model, prompt, quality };
}

// Prompts that use the two-color (black + light gray) stroke scheme. These
// receive STROKE_COLOR_NEW / STROKE_COLOR_PREVIOUS instead of the single
// STROKE_COLOR used by the all-black prompt.
const TWO_COLOR_PROMPTS = new Set(["grayblack", "graysteps"]);

function buildVars(subject, cfg) {
  const isTwoColor = TWO_COLOR_PROMPTS.has(cfg.prompt);
  const base = {
    DRAWING_SUBJECT: subject,
    DRAWING_STEPS_NUMBER: cfg.steps,
    TARGET_AGE_RANGE: cfg.age,
    DRAWING_STYLE: cfg.style,
    LINE_STYLE: cfg.lineStyle,
    PATH_WIDTH: cfg.pathWidth,
    BACKGROUND: "#FFFFFF",
    ASPECT_RATIO: cfg.aspect,
    RESOLUTION_QUALITY: cfg.quality
  };
  if (isTwoColor) {
    base.STROKE_COLOR_NEW = "#000000";
    base.STROKE_COLOR_PREVIOUS = "#C6C6C5";
  } else {
    base.STROKE_COLOR = "#000000";
  }
  return base;
}

function promptForChoice(promptKey) {
  if (promptKey === "grayblack") return PROMPT_V9_GRAYBLACK;
  if (promptKey === "graysteps") return PROMPT_V8_GRAYSTEPS;
  return PROMPT_V8;
}

/* ===========================================================
   State + UI
   =========================================================== */
const state = {
  items: [], // { subject, status: 'pending'|'done'|'error', dataUrl, base64, mime, error }
  running: false,
  totalCost: 0,
  imageCount: 0
};

function loadCostState() {
  try {
    const raw = sessionStorage.getItem(COST_STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.totalCost === "number") state.totalCost = data.totalCost;
    if (typeof data.imageCount === "number") state.imageCount = data.imageCount;
  } catch (_) {}
}

function persistCostState() {
  try {
    sessionStorage.setItem(COST_STORAGE_KEY, JSON.stringify({
      totalCost: state.totalCost,
      imageCount: state.imageCount
    }));
  } catch (_) {}
}

function loadBalance() {
  try {
    const raw = localStorage.getItem(BALANCE_STORAGE_KEY);
    if (raw === null) return null;
    const v = parseFloat(raw);
    return Number.isFinite(v) ? v : null;
  } catch (_) { return null; }
}

function saveBalance(v) {
  try {
    if (v === null || !Number.isFinite(v)) localStorage.removeItem(BALANCE_STORAGE_KEY);
    else localStorage.setItem(BALANCE_STORAGE_KEY, String(v));
  } catch (_) {}
}

function decrementBalance(amount) {
  const current = loadBalance();
  if (current === null) return;
  saveBalance(Math.max(0, current - amount));
  updateBalanceDisplay();
}

function updateBalanceDisplay() {
  const el = document.getElementById("balanceAmount");
  if (!el) return;
  const v = loadBalance();
  if (v === null) {
    el.textContent = "— set —";
    el.classList.add("balance-unset");
  } else {
    el.textContent = `$${v.toFixed(4)}`;
    el.classList.remove("balance-unset");
  }
}

function promptSetBalance() {
  const current = loadBalance();
  const input = prompt(
    "Enter your current Gemini prepaid balance in USD.\n\nThis value is decremented locally on every successful image (synced across all tabs in this browser via localStorage). Leave blank to clear.",
    current === null ? "" : String(current)
  );
  if (input === null) return;
  const trimmed = input.trim();
  if (trimmed === "") { saveBalance(null); updateBalanceDisplay(); return; }
  const v = parseFloat(trimmed);
  if (!Number.isFinite(v) || v < 0) { alert("Please enter a non-negative number."); return; }
  saveBalance(v);
  updateBalanceDisplay();
}

function recordImageCost(modelKey, quality, openaiSize) {
  let price;
  if (modelKey === "openai_image_2") {
    const q = OPENAI_QUALITY_MAP[quality] || "medium";
    const table = OPENAI_PRICING[q];
    if (!table) return null;
    // Fall back to the 1024x1024 row if size is missing for any reason.
    price = table[openaiSize] !== undefined ? table[openaiSize] : table["1024x1024"];
  } else {
    const tier = PRICING[modelKey];
    if (!tier) return null;
    price = tier[quality];
  }
  if (typeof price !== "number") return null;
  state.totalCost += price;
  state.imageCount += 1;
  persistCostState();
  updateCostCounter();
  decrementBalance(price);
  return price;
}

function updateCostCounter() {
  const el = document.getElementById("costAmount");
  if (!el) return;
  el.textContent = `$${state.totalCost.toFixed(4)}`;
  const counter = document.getElementById("costCounter");
  if (counter) {
    counter.title = `Estimated cost since last reset across ${state.imageCount} image(s). Approximate, based on published per-image rates: Google — Pro 1K/2K $0.134, Pro 4K $0.24, Flash 1K $0.067, Flash 2K $0.101, Flash 4K $0.151. OpenAI gpt-image-2 — low ~$0.005, medium ~$0.041, high ~$0.165 (3:2 / 2:3); square (1:1) is slightly higher.`;
  }
}

function resetCostCounter() {
  if (state.imageCount > 0 && !confirm(`Reset cost counter? Current total: $${state.totalCost.toFixed(4)} across ${state.imageCount} image(s).`)) return;
  state.totalCost = 0;
  state.imageCount = 0;
  persistCostState();
  updateCostCounter();
}

function sanitizeFilename(s) {
  return s.replace(/[^a-z0-9\-_ ]/gi, "").replace(/\s+/g, "_").slice(0, 80) || "drawing";
}

function renderGrid() {
  const grid = document.getElementById("resultsGrid");
  if (state.items.length === 0) {
    grid.innerHTML = '<div class="empty-state">No generations yet. Enter subjects and press START.</div>';
    return;
  }
  grid.innerHTML = "";
  state.items.forEach((item, idx) => {
    const card = document.createElement("div");
    let cls = "card";
    if (item.loading) cls += " loading";
    if (item.downloaded) cls += " downloaded";
    if (item.regenerated) cls += " regenerated";
    card.className = cls;

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    if (item.status === "pending") {
      thumb.classList.add("pending");
    } else if (item.status === "error") {
      thumb.classList.add("error");
      thumb.textContent = "Failed: " + (item.error || "unknown error");
    } else if (item.status === "done") {
      const img = document.createElement("img");
      img.src = item.dataUrl;
      img.alt = item.subject;
      img.addEventListener("click", () => openPreview(item.dataUrl));
      thumb.appendChild(img);
      const dimBadge = document.createElement("div");
      dimBadge.className = "dim-badge";
      dimBadge.textContent = "measuring…";
      thumb.appendChild(dimBadge);
      if (typeof item.cost === "number") {
        const costBadge = document.createElement("div");
        costBadge.className = "cost-badge";
        costBadge.textContent = `$${item.cost.toFixed(4)}`;
        thumb.appendChild(costBadge);
      }
      img.addEventListener("load", () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        item.width = w; item.height = h;
        dimBadge.textContent = `${w} × ${h}`;
        console.log(`[Image dimensions] ${item.subject}: ${w} × ${h}`);
      }, { once: true });
    }

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = item.subject;

    const btns = document.createElement("div");
    btns.className = "btns";

    const regen = document.createElement("button");
    regen.textContent = "Regenerate";
    regen.className = "btn-regen";
    regen.onclick = () => regenerate(idx);

    const preview = document.createElement("button");
    preview.textContent = "Preview";
    preview.disabled = item.status !== "done";
    preview.onclick = () => openPreview(item.dataUrl);

    const dl = document.createElement("button");
    dl.textContent = "Download";
    dl.className = "btn-download";
    dl.disabled = item.status !== "done";
    dl.onclick = () => downloadSingle(item);

    btns.append(regen, preview, dl);

    const overlay = document.createElement("div");
    overlay.className = "overlay";

    card.append(thumb, label, btns, overlay);
    grid.appendChild(card);
  });
}

function updateErrorBanner() {
  const banner = document.getElementById("errorBanner");
  const failed = state.items.filter(i => i.status === "error");
  if (failed.length === 0) {
    banner.classList.remove("visible");
    banner.textContent = "";
  } else {
    banner.classList.add("visible");
    banner.textContent = `Failed (${failed.length}): ${failed.map(f => f.subject).join(", ")}`;
  }
}

function updateDownloadAllBtn() {
  const anyDone = state.items.some(i => i.status === "done");
  document.getElementById("downloadAllBtn").disabled = !anyDone;
}

function updateStatus(msg) {
  document.getElementById("status").textContent = msg || "";
}

/* ===========================================================
   Generation flow
   =========================================================== */
async function runBatch() {
  const cfg = readConfig();
  if (cfg.subjects.length === 0) return;

  state.running = true;
  document.getElementById("startBtn").disabled = true;
  document.getElementById("resetBtn").disabled = true;

  state.items = cfg.subjects.map(s => ({ subject: s, status: "pending", loading: false }));
  renderGrid();
  updateErrorBanner();
  updateDownloadAllBtn();

  let completed = 0;
  const total = state.items.length;
  updateStatus(`Generating 0 / ${total}...`);

  const queue = state.items.map((_, i) => i);
  const workers = [];
  for (let w = 0; w < CONCURRENCY; w++) {
    workers.push((async () => {
      while (queue.length > 0) {
        const idx = queue.shift();
        await generateOne(idx, cfg);
        completed++;
        updateStatus(`Generating ${completed} / ${total}...`);
      }
    })());
  }
  await Promise.all(workers);

  state.running = false;
  document.getElementById("resetBtn").disabled = false;
  refreshStartBtn();
  updateStatus(`Done. ${state.items.filter(i => i.status === "done").length} / ${total} succeeded.`);
}

async function generateOne(idx, cfg) {
  const item = state.items[idx];
  try {
    const tpl = promptForChoice(cfg.prompt);
    const vars = buildVars(item.subject, cfg);
    const res = await callImageModel(cfg.model, tpl, vars, item.subject, cfg.aspect, cfg.quality);
    item.status = "done";
    item.dataUrl = res.dataUrl;
    item.base64 = res.base64;
    item.mime = res.mime;
    item.error = null;
    item.cost = recordImageCost(cfg.model, cfg.quality, res.openaiSize);
  } catch (e) {
    item.status = "error";
    item.error = e.message || String(e);
  }
  renderGrid();
  updateErrorBanner();
  updateDownloadAllBtn();
}

async function regenerate(idx) {
  const cfg = readConfig();
  const item = state.items[idx];
  if (!item) return;
  item.loading = true;
  item.status = "pending";
  item.downloaded = false;
  item.regenerated = false;
  renderGrid();
  try {
    const tpl = promptForChoice(cfg.prompt);
    const vars = buildVars(item.subject, cfg);
    const res = await callImageModel(cfg.model, tpl, vars, item.subject, cfg.aspect, cfg.quality);
    item.status = "done";
    item.dataUrl = res.dataUrl;
    item.base64 = res.base64;
    item.mime = res.mime;
    item.error = null;
    item.regenerated = true;
    item.cost = recordImageCost(cfg.model, cfg.quality, res.openaiSize);
  } catch (e) {
    item.status = "error";
    item.error = e.message || String(e);
  }
  item.loading = false;
  renderGrid();
  updateErrorBanner();
  updateDownloadAllBtn();
}

/* ===========================================================
   Download helpers
   =========================================================== */
function extFromMime(m) {
  if (!m) return "png";
  if (m.includes("jpeg") || m.includes("jpg")) return "jpg";
  if (m.includes("webp")) return "webp";
  return "png";
}

function downloadSingle(item) {
  const a = document.createElement("a");
  a.href = item.dataUrl;
  a.download = `${sanitizeFilename(item.subject)}.${extFromMime(item.mime)}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  item.downloaded = true;
  renderGrid();
}

async function downloadAll() {
  const done = state.items.filter(i => i.status === "done");
  if (done.length === 0) return;
  const zip = new JSZip();
  for (const it of done) {
    zip.file(`${sanitizeFilename(it.subject)}.${extFromMime(it.mime)}`, it.base64, { base64: true });
  }
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "howtodraw_worksheets.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  done.forEach(it => { it.downloaded = true; });
  renderGrid();
}

function openPreview(dataUrl) {
  document.getElementById("previewImg").src = dataUrl;
  document.getElementById("previewModal").classList.add("visible");
}

function closePreview() {
  document.getElementById("previewModal").classList.remove("visible");
  document.getElementById("previewImg").src = "";
}

function resetAll() {
  state.items = [];
  renderGrid();
  updateErrorBanner();
  updateDownloadAllBtn();
  updateStatus("");
}

function refreshStartBtn() {
  if (state.running) {
    document.getElementById("startBtn").disabled = true;
    return;
  }
  const subjects = document.getElementById("subjects").value
    .split(",").map(s => s.trim()).filter(Boolean);
  document.getElementById("startBtn").disabled = subjects.length === 0;
}

/* ===========================================================
   Aspect ratio dropdown population (model-aware)
   =========================================================== */
function populateAspectDropdown(preserveValue) {
  const sel = document.getElementById("aspect");
  const modelKey = document.getElementById("model").value;
  const supported = SUPPORTED_RATIOS[modelKey] || [];
  const prev = preserveValue !== undefined ? preserveValue : sel.value;
  sel.innerHTML = "";

  // OpenAI gpt-image-2 only supports a fixed set of sizes; the custom 333:215
  // ratio doesn't apply, so default to 3:2 (1536x1024) instead.
  const isOpenAI = modelKey === "openai_image_2";
  const fallbackDefault = isOpenAI ? "3:2" : CUSTOM_RATIO_DEFAULT;

  if (!isOpenAI) {
    const optDefault = document.createElement("option");
    optDefault.value = CUSTOM_RATIO_DEFAULT;
    optDefault.textContent = `${CUSTOM_RATIO_DEFAULT} (default)`;
    sel.appendChild(optDefault);
  }

  for (const r of supported) {
    const o = document.createElement("option");
    o.value = r;
    o.textContent = isOpenAI && r === "3:2" ? `${r} (default)` : r;
    sel.appendChild(o);
  }

  if (prev && Array.from(sel.options).some(o => o.value === prev)) {
    sel.value = prev;
  } else {
    sel.value = fallbackDefault;
  }
}

/* ===========================================================
   Saved configs (localStorage + custom dropdown)
   =========================================================== */
function loadConfigs() {
  try {
    const raw = localStorage.getItem(CONFIGS_STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}

function persistConfigs(arr) {
  try { localStorage.setItem(CONFIGS_STORAGE_KEY, JSON.stringify(arr)); }
  catch (e) { console.warn("Failed to persist configs:", e); }
}

function snapshotConfig() {
  return {
    subjects: document.getElementById("subjects").value,
    aspect:   document.getElementById("aspect").value,
    steps:    document.getElementById("steps").value,
    age:      document.getElementById("age").value,
    pathWidth:document.getElementById("pathWidth").value,
    style:    document.getElementById("style").value,
    lineStyle:document.getElementById("lineStyle").value,
    model:    document.getElementById("model").value,
    prompt:   document.getElementById("prompt").value,
    quality:  document.getElementById("quality").value
  };
}

function applyConfigValues(v, name) {
  if (!v) return;
  if (v.subjects !== undefined) document.getElementById("subjects").value = v.subjects;
  if (v.model !== undefined) document.getElementById("model").value = v.model;
  populateAspectDropdown(v.aspect);
  if (v.steps !== undefined) document.getElementById("steps").value = v.steps;
  if (v.age !== undefined) document.getElementById("age").value = v.age;
  if (v.pathWidth !== undefined) document.getElementById("pathWidth").value = v.pathWidth;
  if (v.style !== undefined) document.getElementById("style").value = v.style;
  if (v.lineStyle !== undefined) document.getElementById("lineStyle").value = v.lineStyle;
  if (v.prompt !== undefined) document.getElementById("prompt").value = v.prompt;
  if (v.quality !== undefined) document.getElementById("quality").value = v.quality;
  if (name) {
    selectedConfigName = name;
    justSavedValues = snapshotConfig();
  }
  refreshStartBtn();
  refreshSaveConfigStatus();
}

function getSelectedConfigEntry() {
  if (selectedConfigName === DEFAULT_CONFIG_NAME) {
    return { name: DEFAULT_CONFIG_NAME, values: DEFAULT_CONFIG_VALUES };
  }
  return loadConfigs().find(c => c.name === selectedConfigName) || null;
}

function updateConfigsButtonLabel() {
  const btn = document.getElementById("configsBtn");
  const current = snapshotConfig();
  const selected = getSelectedConfigEntry();
  let label;
  let activeName;
  if (selected && valuesEqual(selected.values, current)) {
    label = selected.name;
    activeName = selected.name;
  } else if (selected) {
    label = `${selected.name} (modified)`;
    activeName = selected.name;
  } else {
    selectedConfigName = DEFAULT_CONFIG_NAME;
    label = `${DEFAULT_CONFIG_NAME} (modified)`;
    activeName = DEFAULT_CONFIG_NAME;
  }
  btn.textContent = `Configs: ${label} ▾`;
  // Paint the button with the selected config's saturated palette color so
  // the user can see at a glance which config is active without opening the
  // menu. The locked Default uses a neutral dark gray.
  const color = getConfigColor(activeName);
  btn.style.background = color.sel;
  btn.style.borderColor = color.sel;
  btn.style.color = "#ffffff";
}

// Single-name lookup that mirrors the assignment used by renderConfigsMenu,
// so the Configs button and the menu item always agree on a config's color.
function getConfigColor(name) {
  if (name === DEFAULT_CONFIG_NAME) return { bg: "#f3f4f6", sel: "#374151" };
  const palette = assignConfigPalette(loadConfigs().map(c => c.name));
  return palette.get(name) || { bg: "#f3f4f6", sel: "#374151" };
}

// Curated palette of distinct light pastels. Each entry has a `bg` (idle
// background) and a `sel` (saturated background for the selected entry).
// The selected config in the menu shows the `sel` shade of its own assigned
// color so the user can see at a glance which one is active.
const CONFIG_PALETTE = [
  { bg: "#fde68a", sel: "#f59e0b" }, // amber
  { bg: "#bbf7d0", sel: "#22c55e" }, // green
  { bg: "#bfdbfe", sel: "#3b82f6" }, // blue
  { bg: "#fbcfe8", sel: "#ec4899" }, // pink
  { bg: "#ddd6fe", sel: "#8b5cf6" }, // violet
  { bg: "#fed7aa", sel: "#f97316" }, // orange
  { bg: "#a5f3fc", sel: "#06b6d4" }, // cyan
  { bg: "#fecaca", sel: "#ef4444" }, // red
  { bg: "#d9f99d", sel: "#84cc16" }, // lime
  { bg: "#e9d5ff", sel: "#a855f7" }, // purple
  { bg: "#fef08a", sel: "#eab308" }, // yellow
  { bg: "#cffafe", sel: "#0ea5e9" }, // sky
  { bg: "#fce7f3", sel: "#db2777" }, // rose
  { bg: "#a7f3d0", sel: "#10b981" }, // emerald
  { bg: "#c7d2fe", sel: "#6366f1" }, // indigo
  { bg: "#ffedd5", sel: "#fb923c" }  // peach
];

// Deterministic-but-unique palette assignment for a list of config names.
// Each name hashes to a preferred slot; if that slot is already taken by an
// earlier name in the same render pass, the next free slot is used. This
// guarantees no two configs share a color (until N exceeds the palette
// length, at which point later entries wrap and may repeat).
function assignConfigPalette(names) {
  const result = new Map();
  const used = new Set();
  for (const name of names) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) {
      hash = ((hash << 5) - hash + name.charCodeAt(i)) | 0;
    }
    let idx = Math.abs(hash) % CONFIG_PALETTE.length;
    let attempts = 0;
    while (used.has(idx) && attempts < CONFIG_PALETTE.length) {
      idx = (idx + 1) % CONFIG_PALETTE.length;
      attempts++;
    }
    used.add(idx);
    result.set(name, CONFIG_PALETTE[idx]);
  }
  return result;
}

function renderConfigsMenu() {
  const wrap = document.getElementById("configsWrap");
  const menu = document.getElementById("configsMenu");
  wrap.style.display = "block";
  menu.innerHTML = "";

  const userConfigs = loadConfigs();
  const all = [
    { name: DEFAULT_CONFIG_NAME, values: DEFAULT_CONFIG_VALUES, locked: true },
    ...userConfigs.map(c => ({ ...c, locked: false }))
  ];

  // Assign a unique palette entry to every user config. The locked Default
  // entry uses a neutral gray scheme that does not consume a palette slot.
  const palette = assignConfigPalette(userConfigs.map(c => c.name));

  all.forEach((cfg) => {
    const item = document.createElement("div");
    item.className = "item";
    const isSelected = cfg.name === selectedConfigName;
    let bg, selBg;
    if (cfg.locked) {
      bg = "#f3f4f6";
      selBg = "#9ca3af";
    } else {
      const entry = palette.get(cfg.name);
      bg = entry.bg;
      selBg = entry.sel;
    }
    item.style.setProperty("--item-bg", isSelected ? selBg : bg);
    if (isSelected) {
      item.classList.add("selected");
      item.style.color = "#ffffff";
      item.style.fontWeight = "700";
    }

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = cfg.name;
    name.title = cfg.name;
    name.addEventListener("click", () => {
      applyConfigValues(cfg.values, cfg.name);
      menu.classList.remove("open");
    });
    item.appendChild(name);

    if (!cfg.locked) {
      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.innerHTML = "&times;";
      del.title = "Delete this config";
      if (isSelected) del.style.color = "#fff";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        const userIdx = userConfigs.findIndex(c => c.name === cfg.name);
        if (userIdx >= 0) deleteConfig(userIdx);
      });
      item.appendChild(del);
    }

    menu.appendChild(item);
  });
}

function deleteConfig(idx) {
  const configs = loadConfigs();
  const wasSelected = configs[idx] && configs[idx].name === selectedConfigName;
  configs.splice(idx, 1);
  persistConfigs(configs);
  if (wasSelected) selectedConfigName = DEFAULT_CONFIG_NAME;
  renderConfigsMenu();
  refreshSaveConfigStatus();
}

function valuesEqual(a, b) {
  if (!a || !b) return false;
  const keys = ["subjects","aspect","steps","age","pathWidth","style","lineStyle","model","prompt","quality"];
  return keys.every(k => String(a[k] ?? "") === String(b[k] ?? ""));
}

function findConfigByValues(values) {
  return loadConfigs().find(c => valuesEqual(c.values, values)) || null;
}

let justSavedValues = null;

function refreshSaveConfigStatus() {
  const warn = document.getElementById("saveConfigWarning");
  const btn = document.getElementById("saveConfigBtn");
  const current = snapshotConfig();
  btn.disabled = false;
  if (justSavedValues && valuesEqual(justSavedValues, current)) {
    warn.textContent = "";
    warn.classList.remove("visible");
    updateConfigsButtonLabel();
    return;
  }
  justSavedValues = null;
  const match = loadConfigs().find(c => valuesEqual(c.values, current));
  if (match) {
    warn.textContent = `This config was saved before under the name of '${match.name}'`;
    warn.classList.add("visible");
  } else {
    warn.textContent = "";
    warn.classList.remove("visible");
  }
  updateConfigsButtonLabel();
}

function refreshSaveModalNameStatus() {
  const name = document.getElementById("saveNameInput").value.trim();
  const warn = document.getElementById("saveNameWarning");
  const confirmBtn = document.getElementById("saveConfirmBtn");
  if (name.length === 0) {
    warn.classList.remove("visible");
    confirmBtn.disabled = true;
    return;
  }
  if (name === DEFAULT_CONFIG_NAME) {
    warn.classList.add("visible");
    confirmBtn.disabled = true;
    return;
  }
  const configs = loadConfigs();
  let taken;
  if (saveModalMode === "update") {
    taken = configs.some(c => c.name !== saveModalUpdatingName && c.name === name);
  } else {
    taken = configs.some(c => c.name === name);
  }
  if (taken) {
    warn.classList.add("visible");
    confirmBtn.disabled = true;
  } else {
    warn.classList.remove("visible");
    confirmBtn.disabled = false;
  }
}

function openSaveModal() {
  const current = snapshotConfig();
  const matching = loadConfigs().find(c => valuesEqual(c.values, current));
  if (matching) {
    saveModalMode = "update";
    saveModalUpdatingName = matching.name;
    document.getElementById("saveModalTitle").textContent = "Update Config";
    document.getElementById("saveConfirmBtn").textContent = "Update";
    document.getElementById("saveNameInput").value = matching.name;
  } else {
    saveModalMode = "save";
    saveModalUpdatingName = null;
    document.getElementById("saveModalTitle").textContent = "Save Config";
    document.getElementById("saveConfirmBtn").textContent = "Save";
    document.getElementById("saveNameInput").value = "";
  }
  document.getElementById("saveModal").classList.add("visible");
  refreshSaveModalNameStatus();
  setTimeout(() => {
    const input = document.getElementById("saveNameInput");
    input.focus();
    input.select();
  }, 30);
}

function closeSaveModal() {
  document.getElementById("saveModal").classList.remove("visible");
  document.getElementById("saveNameWarning").classList.remove("visible");
}

function confirmSaveConfig() {
  const name = document.getElementById("saveNameInput").value.trim();
  if (!name || name === DEFAULT_CONFIG_NAME) return;
  const configs = loadConfigs();

  if (saveModalMode === "update") {
    if (name !== saveModalUpdatingName && configs.some(c => c.name === name)) return;
    const idx = configs.findIndex(c => c.name === saveModalUpdatingName);
    if (idx < 0) { closeSaveModal(); return; }
    configs[idx].name = name;
    persistConfigs(configs);
    selectedConfigName = name;
    justSavedValues = configs[idx].values;
  } else {
    if (configs.some(c => c.name === name)) return;
    const values = snapshotConfig();
    if (configs.some(c => valuesEqual(c.values, values))) {
      closeSaveModal();
      refreshSaveConfigStatus();
      return;
    }
    configs.push({ name, values });
    persistConfigs(configs);
    selectedConfigName = name;
    justSavedValues = values;
  }

  renderConfigsMenu();
  closeSaveModal();
  refreshSaveConfigStatus();
}

/* ===========================================================
   Warn before closing the tab if there are generated images
   that have not been downloaded yet.
   =========================================================== */
function hasUndownloadedImages() {
  return Array.isArray(state.items)
    && state.items.some(i => i && i.status === "done" && !i.downloaded);
}
window.addEventListener("beforeunload", (e) => {
  if (hasUndownloadedImages()) {
    e.preventDefault();
    // Modern browsers ignore custom strings but require returnValue to be set.
    e.returnValue = "You have generated images that have not been downloaded yet. If you leave this page, they will be lost.";
    return e.returnValue;
  }
});
</script>
